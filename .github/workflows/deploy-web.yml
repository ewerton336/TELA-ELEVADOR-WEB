name: Build arm64 (rpi43)
# Build da imagem arm64 no GitHub e push para o GHCR com a tag :rpi43.
# O deploy é feito pelo Watchtower no rpi43, que puxa a tag :rpi43 nova e recria o container.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-rpi43
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ewerton336/tela-elevador-web:rpi43
            ghcr.io/ewerton336/tela-elevador-web:rpi43-${{ github.sha }}
          cache-from: type=gha,scope=tela-elevador-web
          cache-to: type=gha,mode=max,scope=tela-elevador-web
