name: Deploy Web to VPS

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]
    types: [closed]

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/ewerton336/tela-elevador-web

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Adicionar VPS ao known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar docker-compose.yml para a VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.VPS_DEPLOY_DIR_WEB }}"
          scp docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_DIR_WEB }}/docker-compose.yml

      - name: Deploy no servidor
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
            set -e
            cd "${{ secrets.VPS_DEPLOY_DIR_WEB }}"

            echo "=== Autenticando no ghcr.io ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "=== Baixando imagem mais recente ==="
            docker compose pull

            echo "=== Subindo container ==="
            docker compose up -d

            docker logout ghcr.io || true

            echo "=== Aguardando inicialização (10s) ==="
            sleep 10

            echo "=== Containers ==="
            docker ps --filter name=tela-elevador-web

            echo "=== Health check (porta 3080) ==="
            HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3080 || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Web respondendo com HTTP $HTTP_STATUS"
            else
              echo "Web respondeu com HTTP $HTTP_STATUS"
              docker compose logs --tail=80 web
              exit 1
            fi

            echo "=== Limpando imagens antigas ==="
            docker image prune -f || true

            echo "=== Deploy concluído ==="
          DEPLOY_SCRIPT

      - name: Verificar domínio público
        run: |
          echo "Testando https://elevador.ewertondev.com.br ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://elevador.ewertondev.com.br || echo "000")
          echo "Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Domínio público retornou $HTTP_STATUS (verifique propagação/Nginx)"
          fi
