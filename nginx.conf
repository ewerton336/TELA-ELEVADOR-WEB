server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para RSS feeds via Node.js
    location /api/rss-proxy {
        proxy_pass http://127.0.0.1:3001/rss-proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # Proxy reverso para API de mensagens
    location /api/messages {
        proxy_pass http://127.0.0.1:3001/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $http_content_type;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # Proxy reverso para API de noticias
    location /api/news {
        proxy_pass http://127.0.0.1:3001/news;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # Proxy reverso para imagens das noticias
    location /api/image-proxy {
        proxy_pass http://127.0.0.1:3001/image-proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }

    # Midia das noticias internas (fotos e videos servidos pelo MediaController).
    # O `^~` e obrigatorio: sem ele o location regex de assets estaticos
    # (\.(js|css|png|jpg|...)$) vence a prefix location /api/, e o nginx tenta
    # servir a foto do disco do frontend, devolvendo 404. Videos escapavam do bug
    # so porque .mp4/.webm nao estao naquele regex.
    location ^~ /api/media/ {
        proxy_pass http://130.250.189.175:8080/api/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        # O nome do arquivo e um GUID novo a cada upload, entao o conteudo nunca
        # muda para a mesma URL: cache longo no navegador da tela do elevador.
        add_header Cache-Control "public, max-age=604800";
    }

    # API principal do backend ASP.NET (predio, clima, noticia, noticia-interna, etc.)
    # Mantido abaixo das rotas /api/* do rss-proxy para nao sobrescrever essas chamadas.
    # `^~` pelo mesmo motivo do /api/media/: qualquer rota de API que termine em
    # extensao de asset seria sequestrada pelo location regex la embaixo.
    location ^~ /api/ {
        proxy_pass http://130.250.189.175:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Proxy reverso para SignalR Hub (WebSocket)
    location /hub/ {
        proxy_pass http://130.250.189.175:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Swagger da API no mesmo dominio
    location /swagger {
        proxy_pass http://130.250.189.175:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger/ {
        proxy_pass http://130.250.189.175:8080/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
